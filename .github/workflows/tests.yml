name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "Pytest failure summary:"
            grep -E 'FAILED|ERROR|passed|failed|short test summary' pytest-output.txt || true
          fi
          exit "$status"
        env:
          PYTHONPATH: .
      - name: Report result
        if: always()
        run: echo "Test workflow completed"
