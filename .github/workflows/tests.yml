name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run test suite
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          exit "$status"
        env:
          PYTHONPATH: .
      - name: Publish pytest failure details
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          {
            echo '## Pytest failure output'
            echo
            echo '```text'
            tail -n 160 pytest-output.txt
            echo '```'
          } > pytest-comment.md
          gh pr comment "$PR_URL" --body-file pytest-comment.md
      - name: Report result
        if: always()
        run: echo "Test workflow completed"
