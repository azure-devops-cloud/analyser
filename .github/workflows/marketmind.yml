name: MarketMind AI

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

jobs:
  marketmind:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest


      - name: Run tests
        run: python -m pytest -q


      - name: Dry run report generation
        run: python -m main --dry-run
        env:
          PYTHONPATH: .


      - name: Run MarketMind AI
        run: python -m main
        env:
          PYTHONPATH: .
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}


      - name: Save database changes
        run: |
          git config --global user.name "marketmind-ai-bot"
          git config --global user.email "marketmind-ai-bot@users.noreply.github.com"

          git add data/marketmind.db

          git commit -m "chore: update market database" || echo "No database changes"

          git push
